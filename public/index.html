<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Lunte</title>
  <link rel="stylesheet" href="/css/controller.css">
</head>
<body>
  <main id="join-screen" class="screen join" hidden>
    <h1>Lunte</h1>
    <form id="join-form" autocomplete="off">
      <label for="name">Dein Name</label>
      <input id="name" name="name" maxlength="12" enterkeyhint="go" autocapitalize="words" spellcheck="false" required>
      <button id="join-button" type="submit">Mitspielen</button>
      <p id="join-error" class="error" role="alert"></p>
    </form>
  </main>

  <main id="wait-screen" class="screen wait" hidden>
    <canvas id="figure" aria-hidden="true"></canvas>
    <div class="identity">
      <p id="color-name" class="color-name"></p>
      <h1 id="player-name"></h1>
      <p id="wait-message" role="status"></p>
      <button id="leave-button" class="quiet" type="button">Spiel verlassen</button>
    </div>
  </main>

  <main id="pad-screen" class="pad" hidden>
    <section id="stick-zone" class="stick-zone" aria-label="Bewegen">
      <div id="dpad" class="dpad" aria-hidden="true">
        <div class="arrow up" data-direction="up"></div>
        <div class="arrow left" data-direction="left"></div>
        <div class="arrow right" data-direction="right"></div>
        <div class="arrow down" data-direction="down"></div>
      </div>
    </section>

    <header class="pad-status">
      <strong id="pad-name"></strong>
      <span id="pad-lives" class="pad-lives"></span>
      <span id="pad-powers" class="pad-powers"></span>
      <span id="pad-link" class="pad-link" hidden>Verbindung weg …</span>
    </header>

    <div id="pad-count" class="pad-count" hidden></div>

    <section class="bomb-zone">
      <button id="bomb-button" class="bomb-button" type="button">Bombe</button>
    </section>
  </main>

  <main id="replaced-screen" class="screen notice" hidden>
    <h1>In einem anderen Tab aktiv</h1>
    <button id="take-over-button" type="button">Hier weiterspielen</button>
  </main>

  <main id="connecting-screen" class="screen notice">
    <h1>Verbinde …</h1>
  </main>

  <div id="rotate-hint" class="rotate-hint">Handy quer halten</div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/figure.js"></script>
  <script src="/js/controller.js"></script>
</body>
</html>
